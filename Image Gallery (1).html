    --bg: #101615; --surface: #182120; --fg: #e8efee; --muted: #93a4a2;
    --line: #2a3836; --accent: #8fa4ff; --accent-fg: #0d1230; color-scheme: dark;
  }

:root[data-theme="dark"] {
  --bg: #101615; --surface: #182120; --fg: #e8efee; --muted: #93a4a2;
  --line: #2a3836; --accent: #8fa4ff; --accent-fg: #0d1230; color-scheme: dark;
}
* { box-sizing: border-box; }

  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;

}
.wrap { max-width: 1280px; margin: 0 auto; }

.tile .cap { position: absolute; inset: auto 0 0 0; padding: 36px 14px 12px; text-align: left; color: #fff; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0)); opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .45s var(--ease); }

.lb-stage { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 16px; }

    lbImg.src = it.src; lbImg.alt = it.title;
    lbTitle.textContent = it.title;
    lbMeta.textContent = it.cat + '  ·  ' + it.w + ' × ' + it.h;
    lbCount.textContent = String(pos + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0');
    lbImg.className = 'out ' + (dir > 0 ? 'fwd' : dir < 0 ? 'back' : '');
    requestAnimationFrame(function () { requestAnimationFrame(function () { lbImg.className = ''; }); });
    [1, -1].forEach(function (d) { var n = list[(pos + d + list.length) % list.length]; var pre = new Image(); pre.src = n.src; });
  }
  function openAt(i, from) {
    list = visible(); pos = Math.max(0, i); opener = from || null;
    paint(0);
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    lbClose.focus();
  }
  function closeLb() {
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (opener && !opener.hidden) opener.focus();
  }
  function step(d) { if (list.length < 2) return; pos = (pos + d + list.length) % list.length; paint(d); }
  lbClose.addEventListener('click', closeLb);
  lbPrev.addEventListener('click', function () { step(-1); });
  lbNext.addEventListener('click', function () { step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.id === 'lbStage' || e.target.id === 'lbFrame') closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') {
      var f = [lbClose, lbPrev, lbNext], i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  var tx = null;
  var frame = document.getElementById('lbFrame');
  frame.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });

  /* Add your own images */
  var addInput = document.getElementById('add');
  document.getElementById('addBtn').addEventListener('click', function () { addInput.click(); });
  addInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(addInput.files).filter(function (f) { return /^image\//.test(f.type); });
    var pending = files.length; if (!pending) return;
    files.forEach(function (f) {
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () {
          var it = { cat: 'Mine', title: f.name.replace(/\.[^.]+$/, ''), w: im.naturalWidth || 1000, h: im.naturalHeight || 1000, src: fr.result };
          items.push(it); makeTile(it, items.length - 1);
          if (cats.indexOf('Mine') < 0) cats.push('Mine');
          if (--pending === 0) { setFilter('Mine'); addInput.value = ''; }
        };
        im.onerror = function () { if (--pending === 0) { setFilter(current); addInput.value = ''; } };
        im.src = fr.result;
      };
      fr.readAsDataURL(f);
    });
  });

  renderChips(); setFilter('All');
})();
</script>
